[package]
name = "scraper"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
async-trait = "0.1.67"
chrono = "0.4.24"
lazy_static = "1.4.0"
regex = "1.7.3"
reqwest = {version = "0.11.14", features = ["json", "blocking"]}
serde = "1.0.157"
serde_derive = "1.0.157"
serde_json = "1.0.94"
simple_logger = "4.1.0"
thiserror = "1.0.40"
common-scrapes = { path = "../common-scrapes" }

[dev-dependencies]
#tokio-macros = "1.8.2"
tokio = { version = "1.26.0", features = ["tokio-macros", "macros", "rt"] }
