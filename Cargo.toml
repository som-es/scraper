[package]
name = "somes-scraper"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
async-trait = "0.1"
chrono = "0.4.26"
regex = "1"
reqwest = {version = "0.12", features = ["json", "blocking"]}
serde = "1.0"
serde_derive = "1.0"
serde_json = "1.0"
simple_logger = "5"
thiserror = "1.0"
#common-scrapes = { path = "common-scrapes" }
common-scrapes = { path = "./common-scrapes" }
# common-scrapes = { git = "ssh://git@github.com/som-es/common-scrapes.git" }
scraper = {version = "0.20", features = ["atomic"] }
once_cell = "1"
ego-tree = "0.9"
log = "0.4.21"
futures = "0.3"
pollster = "0.3.0"
tokio = { version = "1", features = ["tokio-macros", "macros", "rt", "fs", "rt-multi-thread"] }
html-escape = "0.2.13"
chrono-tz = {version="0.10.4", features=["serde"]}
rand = "0.10.1"
quick-xml = "0.36"
deunicode = "1.6.2"

[dev-dependencies]
#tokio-macros = "1.8.2"
flate2 = "1"
csv = "1.3"

[profile.release]
debug = true
