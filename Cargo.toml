[package]
name = "scraper"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
async-trait = "0.1.67"
reqwest = {version = "0.11.14", features = ["json"]}
serde = "1.0.157"
serde_derive = "1.0.157"
