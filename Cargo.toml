[package]
name = "scraper"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
async-trait = "0.1.67"
chrono = "0.4.26"
regex = "1.7.3"
reqwest = {version = "0.11.14", features = ["json", "blocking"]}
serde = "1.0.157"
serde_derive = "1.0.157"
serde_json = "1.0.94"
simple_logger = "4.1.0"
thiserror = "1.0.40"
#common-scrapes = { path = "common-scrapes" }
common-scrapes = { path = "../common-scrapes" }
#common-scrapes = { git = "https://github.com/som-es/common-scrapes.git" }
scraper = "0.16"
once_cell = "1.18.0"
ego-tree = "0.6.2"
log = "0.4.21"
futures = "0.3.30"

[dev-dependencies]
#tokio-macros = "1.8.2"
tokio = { version = "1.26.0", features = ["tokio-macros", "macros", "rt"] }
